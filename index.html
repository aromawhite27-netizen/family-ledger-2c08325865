  <script>
    (function () {
      'use strict';
      var records = JSON.parse(document.getElementById('records-data').textContent);
      function normalize(value) { return String(value == null ? '' : value).replace(/\s+/g, ''); }
      function sortKey(name) {
        return normalize(name).replace(/^曾/, '增').replace(/^解/, '谢');
      }
      var collator = new Intl.Collator('zh-Hans-CN-u-co-pinyin');
      var ordered = [];
      var duplicateTotals = {};
      var duplicateOrdinals = {};
      for (var s = 0; s < records.length; s += 1) {
        var duplicateKey = '$' + normalize(records[s].name);
        duplicateTotals[duplicateKey] = (duplicateTotals[duplicateKey] || 0) + 1;
        duplicateOrdinals['$' + records[s].id] = duplicateTotals[duplicateKey];
        ordered.push({ record: records[s], key: sortKey(records[s].name), position: s });
      }
      ordered.sort(function (a, b) { return collator.compare(a.key, b.key) || a.position - b.position; });
      function selectRecords(query) {
        var needle = normalize(query);
        var selected = [];
        for (var n = 0; n < ordered.length; n += 1) {
          if (normalize(ordered[n].record.name).indexOf(needle) !== -1) { selected.push(ordered[n].record); }
        }
        return selected;
      }
      window.GiftApp = { selectRecords: selectRecords };
      var total = 0;
      for (var t = 0; t < records.length; t += 1) { total += records[t].amount; }
      document.getElementById('total-count').textContent = String(records.length);
      document.getElementById('total-amount').textContent = String(total);
      var target = document.getElementById('results');
      var input = document.getElementById('search-input');
      function render() {
        var displayed = selectRecords(input.value);
        target.textContent = '';
        document.getElementById('results-count').textContent = normalize(input.value) ? '找到 ' + displayed.length + ' 笔' : '全部记录 · ' + displayed.length + ' 笔';
        if (!displayed.length) {
          var emptyRow = document.createElement('tr');
          var emptyCell = document.createElement('td');
          emptyCell.colSpan = 2;
          var emptyTitle = document.createElement('strong');
          emptyTitle.className = 'empty-title';
          emptyTitle.textContent = '没有找到这个姓名';
          var emptyHelp = document.createElement('span');
          emptyHelp.className = 'empty-help';
          emptyHelp.textContent = '试试只输入姓名中的一个字，或点「清空」查看全部。';
          emptyCell.appendChild(emptyTitle);
          emptyCell.appendChild(emptyHelp);
          emptyRow.appendChild(emptyCell);
          target.appendChild(emptyRow);
        }
        for (var i = 0; i < displayed.length; i += 1) {
          var row = document.createElement('tr');
          row.setAttribute('data-record-id', String(displayed[i].id));
          var nameCell = document.createElement('td');
          var name = document.createElement('span');
          name.className = 'record-name';
          name.textContent = displayed[i].name;
          nameCell.appendChild(name);
          if (duplicateTotals['$' + normalize(displayed[i].name)] > 1) {
            var duplicate = document.createElement('span');
            duplicate.className = 'duplicate-label';
            duplicate.textContent = '同名 · 第' + duplicateOrdinals['$' + displayed[i].id] + '笔';
            nameCell.appendChild(duplicate);
          }
          var amountCell = document.createElement('td');
          var amount = document.createElement('span');
          amount.className = 'record-amount';
          amount.textContent = String(displayed[i].amount) + ' 元';
          amountCell.appendChild(amount);
          row.appendChild(nameCell);
          row.appendChild(amountCell);
          target.appendChild(row);
        }
      }
      input.addEventListener('input', render);
      document.getElementById('search-form').addEventListener('submit', function (event) {
        event.preventDefault();
        render();
      });
      document.getElementById('clear-button').addEventListener('click', function () {
        input.value = '';
        render();
      });
      render();
    }());
  </script>
